name: Go Test

on:
  pull_request:
    paths:
      - .github/workflows/go-test.yml
      - internal/**
      - cmd/**
      - docs/**
      - generated/**
      - go.mod
      - go.sum
      - main.go
      - server/**
      - proto/**

jobs:
  linting:
    name: Go lint
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        args: --timeout=30m

  security:
    name: Go Security
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: -exclude=G103,G115 -exclude-generated ./...

  test:
    name: Go test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Install
      run: go mod download -x

    - name: Test
      env:
        MONGO_TEST_URI: mongodb://127.0.0.1:27017
      run: go test -v ./...
