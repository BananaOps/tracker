---
name: PR Conventional Commit Validation

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          # A pull request from a fork gets a read-only token: labelling it
          # fails the job even when the title is valid. Only label pull
          # requests opened from a branch of this repository.
          add_label: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          add_scope_label: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
